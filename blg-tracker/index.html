<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLG Fiber Milestone Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg1:#E9EEF4;--bg2:#F6E6D8;--tile-a:rgba(255,255,255,.9);--ink:#1F1F1F;--muted:#5F6670;--line:#E1E4E8;--track:#E9ECEF;
  --nav:#0D4A86;--nav-ink:#FFFFFF;--nav-sel:#FFFFFF;--nav-sel-ink:#0D4A86;--title:#0D4A86;--input:#FFFFFF;--inline:#C8CDD3;
  --done:#0D8796;--overall:#0D4A86;--bad:#C2412A;--good:#2D8655;--hover:rgba(13,74,134,.06);--sel:rgba(13,74,134,.12);
  --sans:'Segoe UI','Segoe UI Web (West European)',Selawik,-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',sans-serif;
  --light:'Segoe UI Light','Segoe UI',Selawik,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#11161D;--bg2:#1B1712;--tile-a:rgba(28,35,45,.94);--ink:#E6EAEE;--muted:#9AA4AF;--line:#2C3540;--track:#28313C;
  --nav:#0B3463;--nav-ink:#E6EEF8;--nav-sel:#E6EEF8;--nav-sel-ink:#0B3463;--title:#8DB8E8;--input:#151B23;--inline:#3A4552;
  --done:#36C0CF;--overall:#8DB8E8;--bad:#EE7259;--good:#5CC48A;--hover:rgba(141,184,232,.08);--sel:rgba(141,184,232,.16);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg1:#11161D;--bg2:#1B1712;--tile-a:rgba(28,35,45,.94);--ink:#E6EAEE;--muted:#9AA4AF;--line:#2C3540;--track:#28313C;
  --nav:#0B3463;--nav-ink:#E6EEF8;--nav-sel:#E6EEF8;--nav-sel-ink:#0B3463;--title:#8DB8E8;--input:#151B23;--inline:#3A4552;
  --done:#36C0CF;--overall:#8DB8E8;--bad:#EE7259;--good:#5CC48A;--hover:rgba(141,184,232,.08);--sel:rgba(141,184,232,.16);color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg1);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4}
.report{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;max-width:1440px;margin:0 auto;padding:14px;min-height:100vh;
  background:linear-gradient(120deg,var(--bg1) 0%,var(--bg1) 35%,var(--bg2) 100%)}
.nav{background:var(--nav);color:var(--nav-ink);border-radius:28px 28px 0 0;padding:22px 0 24px;align-self:start;position:sticky;top:14px}
.brand{text-align:center;padding:0 12px 18px}
.brand b{display:block;font:600 34px/1 var(--sans);letter-spacing:-.02em}
.brand span{display:block;font-size:10px;letter-spacing:.06em;opacity:.85;margin-top:2px}
.nav h4{margin:14px 0 6px;padding:0 14px;font-size:12px;font-weight:700}
.nav button{display:block;width:calc(100% - 20px);margin:2px 10px;text-align:left;appearance:none;border:0;background:none;color:var(--nav-ink);font:400 15px var(--sans);padding:8px 14px;border-radius:16px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.1)}
.nav button[aria-current="page"]{background:var(--nav-sel);color:var(--nav-sel-ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,.rrow:focus-visible{outline:2px solid var(--done);outline-offset:2px}
.canvas{min-width:0}
.ttl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px;margin:2px 0 10px}
.ttl h1{margin:0;font:600 32px/1.1 var(--sans);color:var(--title)}
.asof{font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--tile-a);border-radius:10px;padding:8px 12px 6px}
.kpi h5{margin:0;font:600 16px var(--sans)}
.kpi b{display:block;text-align:right;font:300 36px/1.15 var(--light);font-variant-numeric:tabular-nums}
.kpi b small{font-size:16px;color:var(--muted);margin-left:6px}
.kpi.alert b{color:var(--bad)}
.tile{background:var(--tile-a);border-radius:10px;padding:12px 14px;margin-bottom:12px;min-width:0}
.tile h2{margin:0;font:600 18px var(--sans)}
.th{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.slicers{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;align-items:end}
.sl label{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
select,input[type=search]{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--input);border:1px solid var(--inline);border-radius:2px;padding:5px 6px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--nav);background:var(--nav);color:#fff;border-radius:4px;padding:6px 12px;font:600 13px var(--sans);cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--input);color:var(--ink);border-color:var(--inline)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:12px}
.cards .tile{margin:0}
.mcard h3{margin:0 0 4px;font:600 15px var(--sans)}
.mcard .pct{font:300 32px/1.1 var(--light);font-variant-numeric:tabular-nums}
.mcard .cnt{font-size:13px;color:var(--muted);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.mcard .foot{font-size:12px;color:var(--muted);margin-top:8px}
.mcard.na .pct{color:var(--muted)}
.tube{height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.tube i{display:block;height:100%;border-radius:6px}
.done{background:var(--done)}.ovr{background:var(--overall)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.ctl input,.ctl select{width:auto;min-width:150px}
.mx{overflow-x:auto}
.mxin{min-width:980px}
.rhead,.rrow{display:grid;grid-template-columns:minmax(190px,1.7fr) minmax(96px,1fr) repeat(7,minmax(74px,.8fr));gap:12px;align-items:center}
.rhead{font-size:12px;font-weight:600;color:var(--muted);padding:0 6px 8px;border-bottom:1px solid var(--line)}
.rhead span:not(:first-child){text-align:center}
.rrow{padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.rrow:hover{background:var(--hover)}
.rrow.sel{background:var(--sel)}
.rrow:last-child{border-bottom:0}
.rname b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{font-size:12px;font-variant-numeric:tabular-nums;text-align:center}
.cell .tube{height:7px;margin-top:3px}
.cell.na{color:var(--muted)}
.rooms{max-height:560px;overflow-y:auto}
details.load summary{cursor:pointer;font:600 16px var(--sans)}
.lgrid label{display:block;font-size:13px;margin:10px 0 3px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.msg{font-size:13px;margin-top:8px}
.msg.err{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg1);padding:8px 14px;border-radius:4px;font-size:13px;display:none;z-index:20}
@media (max-width:860px){
  .report{grid-template-columns:1fr;padding:10px}
  .nav{position:static;border-radius:16px;padding:12px 0}
  .brand{padding-bottom:6px}.brand b{font-size:26px}
  .navlist{display:flex;overflow-x:auto;padding:0 8px}
  .nav h4{display:none}
  .nav button{width:auto;margin:2px;white-space:nowrap}
}
@media (prefers-reduced-motion:no-preference){.tube i{transition:width .4s ease}}
</style>
</head>
<body>
<div class="report">
  <nav class="nav" aria-label="Report pages">
    <div class="brand"><b>aptitude</b><span>intelligent integration</span></div>
    <h4>FIBER MILESTONES</h4>
    <div class="navlist" id="navlist"></div>
  </nav>
  <div class="canvas">
    <div class="ttl"><h1 id="pageTitle">Fiber Milestone Tracker</h1><div class="asof" id="src"></div></div>
    <div id="kpis" class="kpis"></div>
    <section class="tile">
      <div class="slicers" id="slicers"></div>
      <div class="th" style="margin:12px 0 0">
        <div class="legend"><span><i class="sw done"></i>Milestone complete (X)</span><span><i class="sw ovr"></i>Overall completion</span><span>— not tracked on that sheet</span></div>
        <div class="acts">
          <button class="btn sec" type="button" id="clearBtn">Clear filters</button>
          <button class="btn" type="button" id="exportBtn">Export to Excel</button>
        </div>
      </div>
    </section>
    <main id="view"></main>
    <details class="tile load">
      <summary>Load an updated Milestones Tracker</summary>
      <div class="lgrid">
        <label for="ffile">Milestones Tracker workbook (.xlsx). Every sheet with a Pathway Installed column is read; X marks a completed milestone.</label>
        <input type="file" id="ffile" accept=".xlsx,.xlsm,.xls">
        <div id="fmsg"></div>
      </div>
      <p class="note">The file is read in your browser only and is never uploaded.</p>
    </details>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
var STG=['Pathway Installed','Fiber Installed','Fiber Dressed','Rack Install','Fiber Landed','Fiber Terminated','Fiber Tested'];
var SHORT=['Pathway','Installed','Dressed','Rack','Landed','Terminated','Tested'];
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=function(n){return n.toLocaleString('en-US')};
var pct=function(a,b){return b?Math.round(a/b*1000)/10:0};

/* ---------- workbook parser (shared logic with the embedded build) ---------- */
var SECRE=/^T[A-Z]{2}\d\.\d{3}/;
function cl(v){return String(v==null?'':v).replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()}
function room(s){return cl(String(s).replace(/[\[\]]/g,''))}
function label(n){return cl(n).replace(/ CABLE TRACKER$| CABLE$/i,'')}
function parseSheet(name,raw,off){
  var rows=raw.map(function(r){return (r||[]).map(cl)});
  var hi=-1;for(var i=0;i<rows.length;i++){if(rows[i].indexOf('Pathway Installed')>-1){hi=i;break}}
  if(hi<0)return null;
  var col={};rows[hi].forEach(function(c,i){var k=c.toUpperCase();if(c&&!(k in col))col[k]=i});
  var nc,tc;
  if('CABLE' in col){nc=col.CABLE-1;tc=col.CABLE}else if('DESCRIPTION' in col){nc=col.DESCRIPTION;tc=col.FIBER}else return null;
  var fc=col.FROM,zc=col.TO,mc=col.MEGAPOD;
  var sidx=STG.map(function(s){var k=s.toUpperCase();return k in col?col[k]:-1});
  var ap=0;sidx.forEach(function(c,k){if(c>-1)ap|=1<<k});
  var sec='',mega='',out=[],t=label(name);
  for(i=hi+1;i<rows.length;i++){
    var r=rows[i];if(!r.some(Boolean)||r.indexOf('Pathway Installed')>-1)continue;
    var g=function(c){return c==null||c<0?'':(r[c]||'')};
    if(mc!=null&&g(mc))mega=g(mc);
    var sn=r.slice(0,nc).filter(function(x){return SECRE.test(x)})[0];
    if(sn){sec=sn+' | '+g(nc);if(!g(fc))continue}
    var nm=g(nc);if(!nm||nm==='A-END')continue;
    var a=g(fc),z=g(zc),ty=tc!=null?g(tc):'';
    if(!a&&!z&&!ty)continue;
    if(zc==null&&a.indexOf('<>')>-1){var p=a.split('<>');a=p[0];z=p[1]||''}
    var d=0;sidx.forEach(function(c,k){if(c>-1&&g(c).toUpperCase()==='X')d|=1<<k});
    out.push({t:t,sec:sec,mega:mega,name:nm,type:ty,a:room(a),z:room(z),d:d,ap:ap,row:i+1+off});
  }
  return out;
}

/* ---------- data ---------- */
function decode(E){return E.rows.map(function(r){return {t:E.T[r[0]],sec:E.SEC[r[1]],mega:E.MEGA[r[2]],name:r[3],type:r[4],a:r[5],z:r[6],d:r[7],ap:r[8],row:r[9]}})}
var S={cables:[],src:'',asOf:null,synced:false,gate:'loading',page:'all',f:{sec:'',a:'',mega:'',show:''},group:'',sort:'least',q:''};
function trackers(){var o=[];S.cables.forEach(function(c){if(o.indexOf(c.t)<0)o.push(c.t)});return o}

/* ---------- status helpers ---------- */
function complete(c){return (c.d&c.ap)===c.ap}
function outOfSeq(c){var seenGap=false;for(var k=0;k<7;k++){if(!(c.ap>>k&1))continue;var dn=c.d>>k&1;if(!dn)seenGap=true;else if(seenGap)return true}return false}
function statusOf(c){return complete(c)?'Complete':(c.d?'In progress':'Not started')}
function showPass(c,v){
  if(!v)return true;if(v==='Complete'||v==='In progress'||v==='Not started')return statusOf(c)===v;
  if(v==='Out of sequence')return outOfSeq(c);
  var k=STG.indexOf(v.replace(/^Missing: /,''));return k>-1&&(c.ap>>k&1)&&!(c.d>>k&1);
}
function pageList(){return S.page==='all'?S.cables:S.cables.filter(function(c){return c.t===S.page})}
function filtered(){return pageList().filter(function(c){return (!S.f.sec||c.sec===S.f.sec)&&(!S.f.a||c.a===S.f.a)&&(!S.f.mega||c.mega===S.f.mega)&&showPass(c,S.f.show)})}
function agg(list){
  var a={n:list.length,done:[0,0,0,0,0,0,0],app:[0,0,0,0,0,0,0],complete:0,started:0,oos:0,sd:0,sa:0,trk:[{},{},{},{},{},{},{}]};
  list.forEach(function(c){for(var k=0;k<7;k++){if(c.ap>>k&1){a.app[k]++;a.trk[k][c.t]=1;if(c.d>>k&1)a.done[k]++}}
    if(complete(c))a.complete++;if(c.d)a.started++;if(outOfSeq(c))a.oos++});
  for(var k=0;k<7;k++){a.sd+=a.done[k];a.sa+=a.app[k]}
  return a;
}

/* ---------- render ---------- */
var view=document.getElementById('view');
function tube(cls,n,d){return '<div class="tube"><i class="'+cls+'" style="width:'+pct(n,d)+'%"></i></div>'}
function opts(vals,sel){return '<option value="">All</option>'+vals.map(function(v){return '<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>'}).join('')}
function uniq(a){var o=[];a.forEach(function(v){if(v&&o.indexOf(v)<0)o.push(v)});return o}
function groups(){var g=[['sec','Schedule section'],['a','A-end room'],['z','Z-end room']];
  if(pageList().some(function(c){return c.mega}))g.push(['mega','Megapod']);
  if(S.page==='all')g.unshift(['t','Tracker']);return g}
function renderChrome(){
  var trk=trackers();
  document.getElementById('navlist').innerHTML=[['all','All trackers']].concat(trk.map(function(t){return [t,t]})).map(function(p){return '<button type="button" data-page="'+esc(p[0])+'"'+(S.page===p[0]?' aria-current="page"':'')+'>'+esc(p[1])+'</button>'}).join('');
  var title=S.page==='all'?'Fiber Milestone Tracker':S.page+' Milestones';
  document.getElementById('pageTitle').textContent=title;document.title='BLG '+title;
  var d=S.asOf;document.getElementById('src').textContent=d?('Source: '+S.src+'. Data as of '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+(S.by?' (saved by '+S.by+')':'')+(S.synced?'. Auto-synced from ACC.':'.')):'Waiting for data';
  var base=pageList();
  var secs=uniq(base.map(function(c){return c.sec}));
  var rooms=uniq(base.filter(function(c){return !S.f.sec||c.sec===S.f.sec}).map(function(c){return c.a})).sort();
  var megas=uniq(base.map(function(c){return c.mega}));
  var shows=['Complete','In progress','Not started','Out of sequence'].concat(STG.filter(function(s,k){return base.some(function(c){return c.ap>>k&1})}).map(function(s){return 'Missing: '+s}));
  var h='<div class="sl"><label for="fSec">Schedule section</label><select id="fSec">'+opts(secs,S.f.sec)+'</select></div>'+
    '<div class="sl"><label for="fA">A-end room</label><select id="fA">'+opts(rooms,S.f.a)+'</select></div>'+
    (megas.length?'<div class="sl"><label for="fM">Megapod</label><select id="fM">'+opts(megas,S.f.mega)+'</select></div>':'')+
    '<div class="sl"><label for="fShow">Show cables</label><select id="fShow">'+opts(shows,S.f.show)+'</select></div>';
  document.getElementById('slicers').innerHTML=h;
}
function kpi(t,v,sub,alert){return '<div class="kpi'+(alert?' alert':'')+'"><h5>'+t+'</h5><b>'+v+(sub?'<small>'+sub+'</small>':'')+'</b></div>'}
function gateView(){
  if(S.gate==='loading')return '<div class="tile"><h2>Loading the latest tracker data…</h2></div>';
  if(S.gate==='locked')return '<div class="tile" style="max-width:460px"><h2>Enter the team passcode</h2><p class="asof">The tracker data is encrypted. Ask Emory Burch for the passcode.</p>'+
    '<input type="password" id="pass" aria-label="Passcode" autocomplete="current-password" style="width:100%;font:inherit;padding:7px 8px;border:1px solid var(--inline);border-radius:2px;background:var(--input);color:var(--ink)">'+
    '<label style="display:flex;gap:6px;align-items:center;font-size:13px;margin:8px 0"><input type="checkbox" id="remember" checked>Remember on this device</label>'+
    '<button class="btn" type="button" id="unlock">Open dashboard</button><div id="passmsg"></div></div>';
  return '<div class="tile"><h2>No synced data found</h2><p class="asof">Load the Milestones Tracker workbook below to view it.</p></div>';
}
function render(){
  renderChrome();
  if(S.gate!=='ready'){document.getElementById('kpis').innerHTML='';view.innerHTML=gateView();finish();return}
  var list=filtered(),a=agg(list),N=a.n,inst=1;
  document.getElementById('kpis').innerHTML=kpi('Total Cables',fmt(N))+kpi('Fiber Installed',fmt(a.done[inst]),pct(a.done[inst],a.app[inst])+'%')+
    kpi('Fiber Landed',fmt(a.done[4]),pct(a.done[4],a.app[4])+'%')+
    kpi('Fully Complete',fmt(a.complete),pct(a.complete,N)+'%')+kpi('Overall Progress',pct(a.sd,a.sa)+'%');
  if(!N){view.innerHTML='<div class="tile"><h2>No cables match these filters</h2><p class="asof">Clear filters or pick another tracker.</p></div>';finish();return}
  var h='<section class="cards">'+STG.map(function(s,k){
    var ap=a.app[k],dn=a.done[k],nt=Object.keys(a.trk[k]).length;
    if(!ap)return '<div class="tile mcard na"><h3>'+s+'</h3><div class="pct">—</div><div class="cnt">Not tracked here</div>'+tube('done',0,1)+'</div>';
    return '<div class="tile mcard"><h3>'+s+'</h3><div class="pct">'+pct(dn,ap)+'%</div><div class="cnt">'+fmt(dn)+' of '+fmt(ap)+' cables</div>'+tube('done',dn,ap)+
      (S.page==='all'?'<div class="foot">Tracked on '+nt+' of '+trackers().length+' trackers</div>':'')+'</div>';
  }).join('')+'</section>';
  var G=groups();if(!G.some(function(g){return g[0]===S.group}))S.group=G[0][0];
  var gl=G.filter(function(g){return g[0]===S.group})[0][1];
  var m={};list.forEach(function(c){var key=c[S.group]||(S.group==='mega'?'Not in a megapod':'(blank)');(m[key]=m[key]||[]).push(c)});
  var rows=Object.keys(m).map(function(k){var g=agg(m[k]);g.key=k;g.ov=pct(g.sd,g.sa);return g});
  if(S.q)rows=rows.filter(function(r){return r.key.toLowerCase().indexOf(S.q)>-1});
  var srt={least:function(x,y){return x.ov-y.ov||y.n-x.n},most:function(x,y){return y.ov-x.ov||y.n-x.n},size:function(x,y){return y.n-x.n},name:function(x,y){return x.key.localeCompare(y.key)}};
  if(S.group==='t'){var order=trackers();rows.sort(S.sort==='name'?srt.name:(S.sort==='least'&&!S.sortTouched?function(x,y){return order.indexOf(x.key)-order.indexOf(y.key)}:srt[S.sort]))}else rows.sort(srt[S.sort]);
  var selVal=S.group==='sec'?S.f.sec:S.group==='a'?S.f.a:S.group==='mega'?S.f.mega:'';
  h+='<section class="tile"><div class="th"><h2>Milestone Progress by '+esc(gl)+'</h2><div class="ctl">'+
    '<select id="grp" aria-label="Group by">'+G.map(function(g){return '<option value="'+g[0]+'"'+(S.group===g[0]?' selected':'')+'>By '+g[1].toLowerCase()+'</option>'}).join('')+'</select>'+
    '<select id="sort" aria-label="Sort">'+[['least','Least complete first'],['most','Most complete first'],['size','Most cables'],['name','Name']].map(function(o){return '<option value="'+o[0]+'"'+(S.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'+
    '<input type="search" id="q" placeholder="Find" aria-label="Find a row" value="'+esc(S.q)+'"></div></div>'+
    '<div class="mx"><div class="mxin"><div class="rhead"><span>'+esc(gl)+'</span><span>Overall</span>'+SHORT.map(function(s){return '<span>'+s+'</span>'}).join('')+'</div><div class="rooms">'+
    (rows.length?rows.map(function(r){
      var parts=r.key.split(' | '),title=parts.length>1?parts[1]:r.key,sub=(parts.length>1?parts[0]+', ':'')+fmt(r.n)+' cables, '+fmt(r.complete)+' complete';
      return '<div class="rrow'+(selVal===r.key?' sel':'')+'" tabindex="0" data-k="'+esc(r.key)+'" title="'+esc(r.key)+'"><div class="rname"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></div>'+
        '<div class="cell"><b>'+r.ov+'%</b>'+tube('ovr',r.sd,r.sa)+'</div>'+
        STG.map(function(s,k){return r.app[k]?'<div class="cell" title="'+esc(s)+': '+r.done[k]+' of '+r.app[k]+'">'+pct(r.done[k],r.app[k])+'%'+tube('done',r.done[k],r.app[k])+'</div>':'<div class="cell na" title="'+esc(s)+' not tracked">—</div>'}).join('')+'</div>'}).join(''):'<p class="asof">Nothing matches that search.</p>')+
    '</div></div></div></section>';
  view.innerHTML=h;finish();
}
function finish(){document.getElementById('exportBtn').textContent='Export to Excel ('+fmt(filtered().length)+')'}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},3200)}

/* ---------- events ---------- */
function resetF(){S.f={sec:'',a:'',mega:'',show:''};S.q=''}
document.getElementById('navlist').addEventListener('click',function(e){var b=e.target.closest('[data-page]');if(b){S.page=b.dataset.page;resetF();S.group='';render()}});
document.getElementById('slicers').addEventListener('change',function(e){var id=e.target.id,v=e.target.value;
  if(id==='fSec'){S.f.sec=v;S.f.a=''}else if(id==='fA')S.f.a=v;else if(id==='fM')S.f.mega=v;else if(id==='fShow')S.f.show=v;render()});
document.getElementById('clearBtn').addEventListener('click',function(){resetF();render()});
view.addEventListener('change',function(e){if(e.target.id==='grp'){S.group=e.target.value;S.q='';render()}else if(e.target.id==='sort'){S.sort=e.target.value;S.sortTouched=true;render()}});
view.addEventListener('input',function(e){if(e.target.id!=='q')return;S.q=e.target.value.toLowerCase().trim();var pos=e.target.selectionStart;render();var n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)});
function pick(r){var k=r.dataset.k;
  if(S.group==='t'){S.page=k;resetF();S.group='';}
  else if(S.group==='sec'){S.f.sec=S.f.sec===k?'':k;S.f.a=''}
  else if(S.group==='a'){S.f.a=S.f.a===k?'':k}
  else if(S.group==='mega'){S.f.mega=S.f.mega===k?'':k}
  else return;render()}
view.addEventListener('click',function(e){var r=e.target.closest('.rrow');if(r)pick(r)});
view.addEventListener('keydown',function(e){var r=e.target.closest('.rrow');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(r)}});

/* ---------- export ---------- */
document.getElementById('exportBtn').addEventListener('click',function(){
  if(typeof XLSX==='undefined'){toast('The Excel library did not load. Check your connection and reload.');return}
  var list=filtered();if(!list.length){toast('Nothing to export with these filters.');return}
  var rows=list.map(function(c){var o={'Tracker':c.t,'Schedule Section':c.sec,'Megapod':c.mega,'Cable':c.name,'Cable Type':c.type,'A-End':c.a,'Z-End':c.z};
    STG.forEach(function(s,k){o[s]=(c.ap>>k&1)?((c.d>>k&1)?'X':''):'N/A'});o['Status']=statusOf(c);o['Out of Sequence']=outOfSeq(c)?'Yes':'';o['Source Row']=c.row;return o});
  var ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
  ws['!cols']=Object.keys(rows[0]).map(function(k){return {wch:k==='Schedule Section'||k==='Cable'?36:Math.max(10,k.length+2)}});
  XLSX.utils.book_append_sheet(wb,ws,'Cables');
  var tag=[S.page==='all'?'AllTrackers':S.page,S.f.sec.split(' | ')[0],S.f.a,S.f.mega,S.f.show].filter(Boolean).join('_').replace(/[^A-Za-z0-9_-]+/g,'');
  var d=new Date(),ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  XLSX.writeFile(wb,'BLG_Milestones_'+tag+'_'+ds+'.xlsx');toast('Exported '+fmt(rows.length)+' cables.');
});

/* ---------- load updated workbook ---------- */
document.getElementById('ffile').addEventListener('change',function(e){var f=e.target.files[0],box=document.getElementById('fmsg');if(!f)return;
  if(typeof XLSX==='undefined'){box.innerHTML='<p class="msg err">The spreadsheet reader could not load. Check your connection and reload.</p>';return}
  var fr=new FileReader();
  fr.onload=function(ev){try{
    var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'}),all=[],used=[];
    wb.SheetNames.forEach(function(n){var ws=wb.Sheets[n];if(!ws||!ws['!ref'])return;
      var raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:true,raw:false});
      var res=parseSheet(n,raw,XLSX.utils.decode_range(ws['!ref']).s.r);if(res&&res.length){all=all.concat(res);used.push(label(n)+' ('+fmt(res.length)+')')}});
    if(!all.length)throw new Error('none');
    S.cables=all;S.src=f.name;S.synced=false;S.by='';S.gate='ready';S.asOf=(wb.Props&&wb.Props.ModifiedDate)?new Date(wb.Props.ModifiedDate):new Date(f.lastModified||Date.now());
    S.page='all';resetF();S.group='';render();
    box.innerHTML='<p class="msg">Loaded '+fmt(all.length)+' cables from '+esc(used.join(', '))+'.</p>';
  }catch(x){box.innerHTML='<p class="msg err">No milestone sheets found. The workbook needs sheets with a Pathway Installed column.</p>'}};
  fr.readAsArrayBuffer(f);
});

/* ---------- synced data: fetch, decrypt, auto-refresh ---------- */
var DATA_URL='data/milestones.enc.json',KEYNAME='blg-milestones-pass',pkg=null,pass=null;
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function decrypt(p,pw){var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])})
  .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct))})
  .then(function(buf){return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()})
  .then(JSON.parse)}
function apply(E){var keep=S.gate==='ready'&&S.synced;S.cables=decode(E);S.src=E.src;S.asOf=new Date(E.asOf);S.by=E.by||'';S.synced=true;S.gate='ready';
  if(!keep){S.page='all';resetF();S.group=''}render()}
function openPkg(p){
  if(p.plain){apply(p.plain);return Promise.resolve()}
  if(!pass){try{pass=localStorage.getItem(KEYNAME)}catch(e){}}
  if(!pass){S.gate='locked';render();return Promise.resolve()}
  return decrypt(p,pass).then(apply,function(){pass=null;try{localStorage.removeItem(KEYNAME)}catch(e){}S.gate='locked';render()});
}
function fetchData(){
  return fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(p){if(pkg&&pkg.ct===p.ct&&S.gate==='ready')return;pkg=p;return openPkg(p)})
    .catch(function(){if(S.gate!=='ready'){S.gate='none';render();document.querySelector('details.load').open=true}});
}
view.addEventListener('click',function(e){if(e.target.id!=='unlock')return;
  var pw=document.getElementById('pass').value,rem=document.getElementById('remember').checked,msg=document.getElementById('passmsg');
  if(!pw)return;msg.innerHTML='<p class="msg">Opening…</p>';
  decrypt(pkg,pw).then(function(E){pass=pw;if(rem){try{localStorage.setItem(KEYNAME,pw)}catch(x){}}apply(E)},
    function(){msg.innerHTML='<p class="msg err">That passcode did not work.</p>'});
});
view.addEventListener('keydown',function(e){if(e.target.id==='pass'&&e.key==='Enter')document.getElementById('unlock').click()});
render();fetchData();
setInterval(function(){if(!document.hidden)fetchData()},5*60*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)fetchData()});
})();
</script>
